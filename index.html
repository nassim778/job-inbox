<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,480;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="top">
        <div>
          <p class="kicker">Gmail job filter</p>
          <h1>Your hiring inbox</h1>
        </div>
        <p class="meta" id="meta">Loading latest scan…</p>
      </section>

      <section class="stats">
        <article class="stat offer"><b id="n-offers">0</b><span>Acceptances / offers</span></article>
        <article class="stat reject"><b id="n-rejects">0</b><span>Rejections</span></article>
        <article class="stat wait"><b id="n-progress">0</b><span>Still in progress</span></article>
      </section>

      <div class="toolbar">
        <input id="q" type="search" placeholder="Search company or role" />
        <button data-filter="all" class="active">All</button>
        <button data-filter="new">New this scan</button>
      </div>

      <section class="board">
        <div class="col">
          <h2>Acceptances</h2>
          <div class="list" id="acceptances"></div>
        </div>
        <div class="col">
          <h2>Rejections</h2>
          <div class="list" id="rejections"></div>
        </div>
      </section>

      <section class="progress">
        <h2>In progress</h2>
        <div class="list" id="progress"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
