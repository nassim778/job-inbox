<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <strong>Job Inbox</strong>
            <small id="window-label">Last 30 days</small>
          </div>
        </div>
        <nav class="nav">
          <button data-view="all" class="active">All mail</button>
          <button data-view="offer">Offers <b id="n-offers">0</b></button>
          <button data-view="reject">Rejections <b id="n-rejects">0</b></button>
          <button data-view="important">Important <b id="n-important">0</b></button>
        </nav>
        <p class="scan" id="meta">Loading…</p>
      </aside>

      <main>
        <header class="bar">
          <input id="q" type="search" placeholder="Filter by company, role, or subject" />
        </header>

        <section class="hero" id="hero" hidden>
          <p class="hero-kicker">Needs attention</p>
          <div class="hero-list" id="hero-list"></div>
        </section>

        <section class="feed" id="feed"></section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
